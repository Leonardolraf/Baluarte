# SonarQube (B30, RNF-008): análise estática do backend. Rodada local e temporária por
# `node scripts/sonarqube.mjs` (na raiz), que sobe o servidor, gera o token na hora e passa
# SONAR_HOST_URL/SONAR_TOKEN por ambiente. Nenhum token ou senha fica neste arquivo.
sonar.projectKey=baluarte-backend
sonar.projectName=Backend (Express + Prisma)
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.ts

# Cobertura: lcov do `npm run cobertura` (c8, suíte completa). O script reescreve os caminhos
# absolutos do c8 para relativos em coverage/lcov-sonar.info e passa esse caminho ao scanner.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# O mesmo recorte do c8: server.ts só sobe o servidor.
sonar.coverage.exclusions=src/server.ts
