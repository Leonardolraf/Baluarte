# Versão FIXA do osquery que os instaladores do Baluarte instalam (B08) e o SHA-256 de cada
# pacote oficial. Os instaladores (instalar-agente.sh e instalar-agente.ps1) leem este arquivo
# e recusam o pacote se o hash não bater. Formato: CHAVE=valor, sem espaços nem aspas.
#
# Origem: release oficial do osquery no GitHub (osquery/osquery, tag 5.23.1, 24/06/2026):
#   https://github.com/osquery/osquery/releases/download/5.23.1/osquery_5.23.1-1.linux_amd64.deb
#   https://github.com/osquery/osquery/releases/download/5.23.1/osquery_5.23.1-1.linux_arm64.deb
#   https://github.com/osquery/osquery/releases/download/5.23.1/osquery-5.23.1.msi
# Os hashes conferem com o "digest" que o GitHub publica para cada arquivo da release e com os
# mesmos pacotes baixados de https://pkg.osquery.io (deb/ e windows/), conferidos em 08/10/2026.
# O MSI também é assinado (Authenticode) por "OSQUERY a Series of LF Projects, LLC"; o
# instalador do Windows confere a assinatura além do hash.
#
# Para trocar de versão: baixe os pacotes novos das duas origens, confira que os hashes batem
# entre si e com o digest da release, atualize as quatro linhas abaixo e rode a validação
# (sh scripts/validar-agente-docker.sh).
OSQUERY_VERSAO=5.23.1
OSQUERY_DEB_AMD64_SHA256=1431a9a6394657eba3cdd3476a462a6fe9721fc3664a70f23efcf7e37816787a
