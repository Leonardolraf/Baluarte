# Baluarte V2 — PostgreSQL + API (Express + Prisma) + frontends.
#   docker compose up --build -d              -> tudo
#   docker compose up --build -d backend app  -> só banco + API + frontend do produto
#   docker compose up -d db                   -> só o Postgres (desenvolvimento e testes fora do Docker)
#
#   frontend do produto   http://localhost:8081   (baluarte-frontend/, build + Nginx)
#                         https://localhost:8443  (só com certificado: sh scripts/gerar-certificados.sh)
#   API                   http://localhost:8080
#   PostgreSQL            127.0.0.1:5432          (só na máquina local; dados no volume db-data)
#   Mailpit (e-mails)     http://localhost:8025   (caixa de entrada dos convites e redefinições)
#   frontend legado       http://localhost:3000   (frontend/, alvo das suítes Robot)
#
# A porta 8081 (e não 5173) é de propósito: 5173 é o dev server do Vite, que o
# Playwright reutiliza se estiver ocupada — a stack Docker e o modo mock convivem.
# Variáveis num `.env` na raiz (ver .env.example): POSTGRES_PASSWORD (obrigatória), JWT_SECRET, NODE_ENV,
# SMTP_*, EMAIL_REMETENTE, SEED_CONTRATO, SEED_DEMO, SEMEAR_PROIBIDO, CORS_ORIGIN, FRONTEND_URL, HTTPS_REDIRECT, HTTPS_PORT, HSTS_MAX_AGE,
# DOMINIO_INTERNO, VIRUSTOTAL_API_KEY, NVD_API_KEY, CRUZAMENTO_AUTOMATICO.
services:
  # PostgreSQL local. A senha vem do .env da raiz (nunca versionada); sem ela o compose
  # recusa subir. A porta só é publicada em 127.0.0.1: nada de fora da máquina alcança o banco.
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=baluarte
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env da raiz (ver .env.example)}
      - POSTGRES_DB=baluarte
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baluarte -d baluarte"]
      interval: 3s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    environment:
      - DATABASE_URL=postgresql://baluarte:${POSTGRES_PASSWORD}@db:5432/baluarte?schema=public
      - DIRECT_URL=postgresql://baluarte:${POSTGRES_PASSWORD}@db:5432/baluarte?schema=public
      # Vazio = o entrypoint gera um segredo aleatório e o guarda no volume (/data/jwt.secret).
      # Nunca há segredo fixo versionado; em NODE_ENV=production a API exige um segredo forte.
      - JWT_SECRET=${JWT_SECRET:-}
      - PORT=8080
      - NODE_ENV=${NODE_ENV:-development}
      # E-mails de conta (convite, redefinição de senha) e da campanha de phishing simulado. Padrão: o Mailpit abaixo, que
      # guarda tudo e não entrega nada para fora. Em produção, aponte para o SMTP real.
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - EMAIL_REMETENTE=${EMAIL_REMETENTE:-Baluarte <nao-responda@baluarte.local>}
      # Antivírus (B04): clamd do serviço clamav (perfil `antivirus`). Sem ele, 503 na análise.
      - CLAMAV_HOST=${CLAMAV_HOST:-clamav}
      - CLAMAV_PORT=${CLAMAV_PORT:-3310}
      # Segunda opinião do VirusTotal (B20), só pelo SHA-256 (o arquivo nunca sai). Vazio = desligada.
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY:-}
      # Cruzamento do inventário das estações com OSV/NVD (B14). A chave do NVD é opcional e só vem do .env.
      - NVD_API_KEY=${NVD_API_KEY:-}
      - CRUZAMENTO_AUTOMATICO=${CRUZAMENTO_AUTOMATICO:-}
      # Base dos links enviados por e-mail (convite, redefinição de senha, campanha).
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8081}
      # Origens permitidas no CORS (os frontends falam por proxy/mesma origem; isto é para chamadas diretas).
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:8081,http://localhost:5173,http://localhost:5174,http://localhost:3000}
      # Seeds DESLIGADOS por omissão (DT28): os dois criam contas com as senhas públicas do README.
      # Cada um roda só na primeira subida com o volume backend-data (marcador em /data).
      # Demo local:            SEED_CONTRATO=1 SEED_DEMO=1 docker compose up --build -d
      # Suítes Newman/Robot:   SEED_CONTRATO=1 SEED_DEMO=0 docker compose up --build -d  (banco limpo: down -v antes)
      - SEED_CONTRATO=${SEED_CONTRATO:-0}
      - SEED_DEMO=${SEED_DEMO:-0}
      # 1 = recusa subir com qualquer SEED_*=1 (ligado no docker-compose.servidor.yml; NODE_ENV=production faz o mesmo).
      - SEMEAR_PROIBIDO=${SEMEAR_PROIBIDO:-0}
      # Domínio interno aceito como destinatário de campanha. Sem padrão aqui (DT28): vazio, a
      # API usa @empresa.com (o do contrato N2 AT1) só fora de produção; com NODE_ENV=production
      # ela recusa subir sem um DOMINIO_INTERNO próprio. Escrever @empresa.com aqui faria
      # qualquer produção montada só com este arquivo herdar o domínio de um terceiro.
      - DOMINIO_INTERNO=${DOMINIO_INTERNO:-}
    # /data guarda só o JWT_SECRET gerado, os marcadores dos seeds e as senhas do seed:demo
    # (senhas-demo.txt, DT32; os dados ficam no Postgres). Backup do banco (pg_dump) não leva o /data.
    volumes:
      - backend-data:/data
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  # Servidor de e-mail de teste: recebe por SMTP (1025) e mostra numa caixa web (8025).
  # Não entrega nada para fora. As duas portas só ficam em 127.0.0.1; a 1025 serve à API
  # rodando fora do Docker (SMTP_HOST=127.0.0.1 no backend/.env).
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  # Antivírus da análise de arquivos (B04). Perfil opcional: precisa de 3 a 4 GiB de RAM para
  # carregar as assinaturas (documentação do ClamAV), então não sobe no `docker compose up`
  # padrão. Ligue com `docker compose --profile antivirus up -d`. Sem ele, a API responde
  # 503 ANTIVIRUS_INDISPONIVEL. O freshclam atualiza as assinaturas sozinho (1x por dia) e as
  # guarda no volume, para não baixar tudo de novo a cada subida. A porta 3310 (clamd) fica só
  # em 127.0.0.1, para a API rodando fora do Docker; nada de fora da máquina a alcança.
  #
  # Regras YARA próprias do Baluarte (B23): antivirus/regras/baluarte_*.yar. O clamd só lê
  # assinaturas do diretório de banco (/var/lib/clamav, sem subpastas), e o /init da imagem faz
  # `chown -R` nele, o que falha num arquivo montado só para leitura. Por isso as regras são
  # montadas em /regras-baluarte e copiadas para o banco a cada subida, antes do /init: o que
  # sai do repositório sai do volume (apaga baluarte_*.yar e copia de novo). O freshclam só
  # mexe nos bancos oficiais (main, daily, bytecode) e não apaga arquivos extras. Regra nova:
  # `docker compose --profile antivirus restart clamav` (ver README, "Regras YARA").
  #
  # Limites do clamd (Melhorias #18, medidos em 13 e 14/10/2026 no ClamAV 1.5.4 com as assinaturas
  # e as regras do Baluarte). O /init da imagem oficial grava cada CLAMD_CONF_<Opção>=<valor> no
  # clamd.conf. A regra: SÓ A COTA CORTA, E ELA AVISA.
  #   StreamMaxLength 251M  o envio: 250 MB da API (LIMITE_ARQUIVO_BYTES) + 1 MB de folga. Acima,
  #                         o clamd recusa e a API responde 503 (o padrão, 100M, cortava em ~100 MB).
  #   MaxScanSize 1000M     a cota: quanto o clamd varre por envio, somando o que sai de dentro de
  #                         compactados e as cópias normalizadas de HTML/script. Estourou, volta
  #                         Heuristics.Limits.Exceeded.MaxScanSize (AlertExceedsMax).
  #   MaxFileSize, MaxHTMLNormalize, MaxScriptNormalize, PCREMaxFileSize 1001M
  #                         esses quatro NÃO avisam: acima deles o clamd corta o arquivo (o de dentro
  #                         de um zip é "trimmed" para o MaxFileSize e só o começo é varrido), pula a
  #                         normalização ou pula as regras com expressão regular, e responde "OK".
  #                         Medido: membro de 300 MiB com o marcador no fim saía "OK" em 1,3 s com
  #                         MaxFileSize 251M; HTML acima de 40 MB saía "OK" sem a regra de HTML
  #                         smuggling (padrão 40M). Acima da cota, eles nunca são o limite: tudo o
  #                         que passaria deles estoura antes a cota, que avisa.
  #   AlertExceedsMax yes   decisão do Leo: limite excedido conta como ameaça
  #                         (Heuristics.Limits.Exceeded.<Limite>), não como "OK". Medido (14/10): avisa
  #                         em MaxScanSize (zip que expande para 1,1 GiB), MaxRecursion (20 zips
  #                         aninhados; 10 passam), MaxFiles (zip de 9.999 arquivos com MaxScanTime em
  #                         600 s; 5.001 passam) e MaxScanTime. O clamd.conf.sample da 1.5.4 diz que
  #                         cobre só MaxFileSize, MaxScanSize e MaxRecursion: está desatualizado (o
  #                         MaxFileSize de membro de zip NÃO avisa, os outros dois avisam).
  #   MaxScanTime 240000    tempo máximo de uma varredura (ms). Padrão implícito: 120000 (o clamd.log
  #                         diz "Global time limit set to 120000"; o clamconf mostra "disabled").
  #                         Estourou, com AlertExceedsMax volta Heuristics.Limits.Exceeded.MaxScanTime
  #                         (ameaça); SEM o alerta, volta "OK" calado, até com o marcador no arquivo
  #                         (medido). 240 s: abaixo do tempo limite do clamd na API (CLAMAV_TIMEOUT_MS,
  #                         300 s), para quem responde ser sempre o clamd, com o alerta, e não um 503;
  #                         e acima dos 120 s, porque um zip legítimo de ~10 mil arquivos levou 134 s
  #                         aqui (~14 ms por arquivo) e numa VM menor levaria mais.
  # Custo medido (desktop de 16 núcleos): 250 MB enviados direto, 20 a 65 s de varredura e +0,5 a
  # +0,8 GiB de RAM; zip com um membro de 900 MiB, 84 s e pico de 2,7 GiB no contêiner (base de
  # ~0,95 GiB), com o membro extraído no /tmp. A API espera até 300 s (CLAMAV_TIMEOUT_MS); passou
  # disso, 503. Os tempos de leitura padrão bastam: ReadTimeout 120 s entre blocos (eles fluem
  # enquanto o arquivo chega) e CommandReadTimeout 30 s até o comando (a API manda na hora).
  # LIMITE CONHECIDO, fora do alcance da configuração: entrada de zip no formato Zip64 não é
  # aberta pelo ClamAV 1.5.4 ("compressed data not available") e o zip sai "OK" (marcador dentro
  # de uma entrada Zip64: "OK"; no zip comum: detectado). Registrado no relatório do #18.
  clamav:
    image: clamav/clamav:1.5
    profiles: ["antivirus"]
    environment:
      - CLAMD_CONF_StreamMaxLength=251M
      - CLAMD_CONF_MaxScanSize=1000M
      - CLAMD_CONF_MaxFileSize=1001M
      - CLAMD_CONF_MaxHTMLNormalize=1001M
      - CLAMD_CONF_MaxScriptNormalize=1001M
      - CLAMD_CONF_PCREMaxFileSize=1001M
      - CLAMD_CONF_AlertExceedsMax=yes
      - CLAMD_CONF_MaxScanTime=240000
    entrypoint:
      - /bin/sh
      - -c
      - |
        rm -f /var/lib/clamav/baluarte_*.yar /var/lib/clamav/baluarte_*.yara
        for regra in /regras-baluarte/baluarte_*.yar /regras-baluarte/baluarte_*.yara; do
          [ -f "$$regra" ] && cp "$$regra" /var/lib/clamav/ && chmod 0644 "/var/lib/clamav/$${regra##*/}"
        done
        echo "Regras YARA do Baluarte: $$(ls /var/lib/clamav | grep -c '^baluarte_')"
        exec /init
    volumes:
      - clamav-db:/var/lib/clamav
      - ./antivirus/regras:/regras-baluarte:ro
    ports:
      - "127.0.0.1:3310:3310"

  # SPA React (baluarte-frontend/): build de produção servido por Nginx, com /api
  # encaminhado ao serviço backend (ver baluarte-frontend/nginx/).
  # HTTPS (B06): com certificado em certs/servidor/ (scripts/gerar-certificados.sh) o Nginx
  # também atende TLS 1.3/1.2 na 8443; sem ele, sobe só em HTTP na 8081, como antes.
  # A pasta montada tem só o certificado e a chave do servidor; a chave da CA fica em certs/.
  app:
    build: ./baluarte-frontend
    environment:
      # 1 = a 8081 só redireciona para o HTTPS (só vale com certificado). Padrão 0: as suítes
      # (Playwright em modo real, README) usam http://localhost:8081.
      - HTTPS_REDIRECT=${HTTPS_REDIRECT:-0}
      # Porta publicada do HTTPS, usada no endereço do redirecionamento.
      - HTTPS_PORT=${HTTPS_PORT:-8443}
      - HSTS_MAX_AGE=${HSTS_MAX_AGE:-31536000}
    volumes:
      - ./certs/servidor:/etc/nginx/certs:ro
    ports:
      - "8081:80"
      - "${HTTPS_PORT:-8443}:443"
    depends_on:
      backend:
        condition: service_healthy

  # Frontend legado (telas do Figma): alvo das suítes Robot Framework da N2 AT1 (e2e/*.robot).
  frontend:
    build: ./frontend
    environment:
      # o proxy /api do Vite aponta para o serviço backend na rede do compose
      - VITE_API_TARGET=http://backend:8080
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  clamav-db:
  db-data:
  backend-data:
