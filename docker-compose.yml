# Baluarte V2 — PostgreSQL + API (Express + Prisma) + frontends.
#   docker compose up --build -d              -> tudo
#   docker compose up --build -d backend app  -> só banco + API + frontend do produto
#   docker compose up -d db                   -> só o Postgres (desenvolvimento e testes fora do Docker)
#
#   frontend do produto   http://localhost:8081   (baluarte-frontend/, build + Nginx)
#                         https://localhost:8443  (só com certificado: sh scripts/gerar-certificados.sh)
#   API                   http://localhost:8080
#   PostgreSQL            127.0.0.1:5432          (só na máquina local; dados no volume db-data)
#   Mailpit (e-mails)     http://localhost:8025   (caixa de entrada dos convites e redefinições)
#   frontend legado       http://localhost:3000   (frontend/, alvo das suítes Robot)
#
# A porta 8081 (e não 5173) é de propósito: 5173 é o dev server do Vite, que o
# Playwright reutiliza se estiver ocupada — a stack Docker e o modo mock convivem.
# Variáveis num `.env` na raiz (ver .env.example): POSTGRES_PASSWORD (obrigatória), JWT_SECRET, NODE_ENV,
# SMTP_*, EMAIL_REMETENTE, SEED_DEMO, CORS_ORIGIN, FRONTEND_URL, HTTPS_REDIRECT, HTTPS_PORT, HSTS_MAX_AGE,
# DOMINIO_INTERNO.
services:
  # PostgreSQL local. A senha vem do .env da raiz (nunca versionada); sem ela o compose
  # recusa subir. A porta só é publicada em 127.0.0.1: nada de fora da máquina alcança o banco.
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=baluarte
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env da raiz (ver .env.example)}
      - POSTGRES_DB=baluarte
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baluarte -d baluarte"]
      interval: 3s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    environment:
      - DATABASE_URL=postgresql://baluarte:${POSTGRES_PASSWORD}@db:5432/baluarte?schema=public
      - DIRECT_URL=postgresql://baluarte:${POSTGRES_PASSWORD}@db:5432/baluarte?schema=public
      # Vazio = o entrypoint gera um segredo aleatório e o guarda no volume (/data/jwt.secret).
      # Nunca há segredo fixo versionado; em NODE_ENV=production a API exige um segredo forte.
      - JWT_SECRET=${JWT_SECRET:-}
      - PORT=8080
      - NODE_ENV=${NODE_ENV:-development}
      # E-mails de conta (convite, redefinição de senha) e da campanha de phishing simulado. Padrão: o Mailpit abaixo, que
      # guarda tudo e não entrega nada para fora. Em produção, aponte para o SMTP real.
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - EMAIL_REMETENTE=${EMAIL_REMETENTE:-Baluarte <nao-responda@baluarte.local>}
      # Antivírus (B04): clamd do serviço clamav (perfil `antivirus`). Sem ele, 503 na análise.
      - CLAMAV_HOST=${CLAMAV_HOST:-clamav}
      - CLAMAV_PORT=${CLAMAV_PORT:-3310}
      # Base dos links enviados por e-mail (convite, redefinição de senha, campanha).
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8081}
      # Origens permitidas no CORS (os frontends falam por proxy/mesma origem; isto é para chamadas diretas).
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:8081,http://localhost:5173,http://localhost:5174,http://localhost:3000}
      # 1 = carrega dados de demonstração na primeira subida (0 = só o seed de contrato)
      - SEED_DEMO=${SEED_DEMO:-1}
      # Domínio interno aceito como destinatário de campanha (padrão: @empresa.com, o do contrato).
      - DOMINIO_INTERNO=${DOMINIO_INTERNO:-@empresa.com}
    # /data guarda só o JWT_SECRET gerado e o marcador do seed:demo (os dados ficam no Postgres).
    volumes:
      - backend-data:/data
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  # Servidor de e-mail de teste: recebe por SMTP (1025) e mostra numa caixa web (8025).
  # Não entrega nada para fora. As duas portas só ficam em 127.0.0.1; a 1025 serve à API
  # rodando fora do Docker (SMTP_HOST=127.0.0.1 no backend/.env).
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  # Antivírus da análise de arquivos (B04). Perfil opcional: precisa de 3 a 4 GiB de RAM para
  # carregar as assinaturas (documentação do ClamAV), então não sobe no `docker compose up`
  # padrão. Ligue com `docker compose --profile antivirus up -d`. Sem ele, a API responde
  # 503 ANTIVIRUS_INDISPONIVEL. O freshclam atualiza as assinaturas sozinho (1x por dia) e as
  # guarda no volume, para não baixar tudo de novo a cada subida. A porta 3310 (clamd) fica só
  # em 127.0.0.1, para a API rodando fora do Docker; nada de fora da máquina a alcança.
  clamav:
    image: clamav/clamav:1.5
    profiles: ["antivirus"]
    volumes:
      - clamav-db:/var/lib/clamav
    ports:
      - "127.0.0.1:3310:3310"

  # SPA React (baluarte-frontend/): build de produção servido por Nginx, com /api
  # encaminhado ao serviço backend (ver baluarte-frontend/nginx/).
  # HTTPS (B06): com certificado em certs/servidor/ (scripts/gerar-certificados.sh) o Nginx
  # também atende TLS 1.3/1.2 na 8443; sem ele, sobe só em HTTP na 8081, como antes.
  # A pasta montada tem só o certificado e a chave do servidor; a chave da CA fica em certs/.
  app:
    build: ./baluarte-frontend
    environment:
      # 1 = a 8081 só redireciona para o HTTPS (só vale com certificado). Padrão 0: as suítes
      # (Playwright em modo real, README) usam http://localhost:8081.
      - HTTPS_REDIRECT=${HTTPS_REDIRECT:-0}
      # Porta publicada do HTTPS, usada no endereço do redirecionamento.
      - HTTPS_PORT=${HTTPS_PORT:-8443}
      - HSTS_MAX_AGE=${HSTS_MAX_AGE:-31536000}
    volumes:
      - ./certs/servidor:/etc/nginx/certs:ro
    ports:
      - "8081:80"
      - "${HTTPS_PORT:-8443}:443"
    depends_on:
      backend:
        condition: service_healthy

  # Frontend legado (telas do Figma): alvo das suítes Robot Framework da N2 AT1 (e2e/*.robot).
  frontend:
    build: ./frontend
    environment:
      # o proxy /api do Vite aponta para o serviço backend na rede do compose
      - VITE_API_TARGET=http://backend:8080
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  clamav-db:
  db-data:
  backend-data:
