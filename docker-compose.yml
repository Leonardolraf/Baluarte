# Baluarte V2 — PostgreSQL + API (Express + Prisma) + frontends.
#   docker compose up --build -d              -> tudo
#   docker compose up --build -d backend app  -> só banco + API + frontend do produto
#   docker compose up -d db                   -> só o Postgres (desenvolvimento e testes fora do Docker)
#
#   frontend do produto   http://localhost:8081   (baluarte-frontend/, build + Nginx)
#   API                   http://localhost:8080
#   PostgreSQL            127.0.0.1:5432          (só na máquina local; dados no volume db-data)
#   frontend legado       http://localhost:3000   (frontend/, alvo das suítes Robot)
#
# A porta 8081 (e não 5173) é de propósito: 5173 é o dev server do Vite, que o
# Playwright reutiliza se estiver ocupada — a stack Docker e o modo mock convivem.
# Variáveis num `.env` na raiz (ver .env.example): POSTGRES_PASSWORD (obrigatória), JWT_SECRET, NODE_ENV,
# RESET_TOKEN_CONSOLE, TREINAMENTO_LINK_CONSOLE, SEED_DEMO, CORS_ORIGIN, FRONTEND_URL.
services:
  # PostgreSQL local. A senha vem do .env da raiz (nunca versionada); sem ela o compose
  # recusa subir. A porta só é publicada em 127.0.0.1: nada de fora da máquina alcança o banco.
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=baluarte
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env da raiz (ver .env.example)}
      - POSTGRES_DB=baluarte
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baluarte -d baluarte"]
      interval: 3s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    environment:
      - DATABASE_URL=postgresql://baluarte:${POSTGRES_PASSWORD}@db:5432/baluarte?schema=public
      - DIRECT_URL=postgresql://baluarte:${POSTGRES_PASSWORD}@db:5432/baluarte?schema=public
      # Vazio = o entrypoint gera um segredo aleatório e o guarda no volume (/data/jwt.secret).
      # Nunca há segredo fixo versionado; em NODE_ENV=production a API exige um segredo forte.
      - JWT_SECRET=${JWT_SECRET:-}
      - PORT=8080
      - NODE_ENV=${NODE_ENV:-development}
      # 1 = imprime o token de redefinição de senha no log (único canal de entrega nesta
      # demonstração — não há serviço de e-mail). Use 0 em qualquer ambiente compartilhado;
      # em NODE_ENV=production o token nunca é impresso, independente deste valor.
      - RESET_TOKEN_CONSOLE=${RESET_TOKEN_CONSOLE:-1}
      # 1 = imprime no log o link de treinamento de cada destinatário ao criar uma campanha
      # (mesma regra: nunca em NODE_ENV=production).
      - TREINAMENTO_LINK_CONSOLE=${TREINAMENTO_LINK_CONSOLE:-1}
      # Base usada para montar o link de redefinição impresso no log.
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8081}
      # Origens permitidas no CORS (os frontends falam por proxy/mesma origem; isto é para chamadas diretas).
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:8081,http://localhost:5173,http://localhost:5174,http://localhost:3000}
      # 1 = carrega dados de demonstração na primeira subida (0 = só o seed de contrato)
      - SEED_DEMO=${SEED_DEMO:-1}
    # /data guarda só o JWT_SECRET gerado e o marcador do seed:demo (os dados ficam no Postgres).
    volumes:
      - backend-data:/data
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  # SPA React (baluarte-frontend/): build de produção servido por Nginx, com /api
  # encaminhado ao serviço backend (ver baluarte-frontend/nginx.conf).
  app:
    build: ./baluarte-frontend
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_healthy

  # Frontend legado (telas do Figma): alvo das suítes Robot Framework da N2 AT1 (e2e/*.robot).
  frontend:
    build: ./frontend
    environment:
      # o proxy /api do Vite aponta para o serviço backend na rede do compose
      - VITE_API_TARGET=http://backend:8080
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
  backend-data:
