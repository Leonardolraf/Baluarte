# Propriedades do JMeter para o plano baluarte-carga.jmx (passadas com -q pelo npm run carga:jmeter).

# Resultado em CSV, com os campos que o backend/scripts/carga.mjs lê para calcular os percentis.
jmeter.save.saveservice.output_format=csv
jmeter.save.saveservice.timestamp_format=ms
jmeter.save.saveservice.thread_counts=true
jmeter.save.saveservice.assertion_results_failure_message=true
# Nunca grava corpo de requisição ou de resposta (o corpo do login tem a senha).
jmeter.save.saveservice.response_data=false
jmeter.save.saveservice.samplerData=false
jmeter.save.saveservice.requestHeaders=false
jmeter.save.saveservice.responseHeaders=false

# Relatório HTML: fora o aquecimento e a preparação (login dos tokens), como no npm run carga.
jmeter.reportgenerator.report_title=Baluarte - carga da API (RNF-004)
jmeter.reportgenerator.sample_filter=^(?!Aquecimento|Prepara).*
# Percentis sobre todas as amostras (o padrão do JMeter usa uma janela das últimas 20.000).
jmeter.reportgenerator.statistic_window=100000000
# Apdex com a régua do RNF-004: satisfeito até 3 s, tolerado até 12 s.
jmeter.reportgenerator.apdex_satisfied_threshold=3000
jmeter.reportgenerator.apdex_tolerated_threshold=12000
aggregate_rpt_pct1=90
aggregate_rpt_pct2=95
aggregate_rpt_pct3=99
jmeter.reportgenerator.overall_granularity=1000
