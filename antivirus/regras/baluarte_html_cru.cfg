# Baluarte (DT26) - configuracao dinamica (DCONF) do ClamAV: varrer tambem o HTML CRU.
#
# Por padrao o ClamAV 1.5 liga o submodulo DOCUMENT/HTMLSKIPRAW (bit 0x10): num arquivo que ele
# reconhece como HTML (pelo conteudo, nao pela extensao, inclusive a parte HTML de um e-mail),
# a varredura do arquivo cru e PULADA e as assinaturas, inclusive as regras YARA, so veem as
# formas normalizadas (nocomment.html e notags.html): tudo em minusculas, entidades decodificadas,
# espacos fora do texto retirados e COMENTARIOS APAGADOS. Medido no clamscan --debug: no .txt
# aparece "Performing raw scan", no .html nao; um marcador em comentario HTML nao chega a nenhuma
# das formas que o YARA ve.
#
# Esta linha mantem todos os submodulos de DOCUMENT ligados e desliga so o HTMLSKIPRAW
# (0xffffffef = todos os bits menos o 0x10; bits sem uso sao ignorados), sem nivel maximo de
# funcionalidade. Com ela o HTML e varrido cru E normalizado. O ClamAV carrega o daily (e o
# daily.cfg dele) antes dos arquivos locais, entao esta linha prevalece; se uma versao futura
# do daily/main trouxer um DOCUMENT para o nivel atual e vencer, a suite de aceitacao contra o
# clamd real (marcador em comentario HTML) falha.
DOCUMENT:0xffffffef:0
