# Nginx do frontend Baluarte (usado pelo Dockerfile).
# - Serve o build estático com fallback para index.html (rotas do React Router).
# - Encaminha /api para o backend Express na rede do Compose.
# Os cabeçalhos de segurança se repetem em cada location porque `add_header`
# não é herdado quando o bloco define os seus próprios cabeçalhos.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Assets com hash no nome podem ser cacheados por muito tempo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    # DNS interno do Docker: resolve `backend` a cada 10 s, então o Nginx sobe mesmo
    # sem a API no ar e acompanha a troca de IP do serviço.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $upstream_api backend;
        proxy_pass http://$upstream_api:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # index.html (e qualquer rota do SPA) nunca fica em cache: após um deploy o
    # navegador precisa buscar o index novo, que aponta para os chunks novos.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri/ /index.html;
    }
}
