# SonarQube (B30, RNF-008): análise estática do frontend do produto. Rodada local e temporária
# por `node scripts/sonarqube.mjs` (na raiz), que sobe o servidor, gera o token na hora e passa
# SONAR_HOST_URL/SONAR_TOKEN por ambiente. Nenhum token ou senha fica neste arquivo.
sonar.projectKey=baluarte-frontend
sonar.projectName=Frontend do produto (React + Vite)
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.exclusions=src/__tests__/**
sonar.tests=src/__tests__,e2e
sonar.test.inclusions=src/__tests__/**,e2e/**

# Cobertura: lcov do `npm run test:coverage` (Vitest, provider v8). O mesmo recorte do
# vitest.config.ts: main.tsx e vite-env.d.ts ficam fora da conta.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/main.tsx,src/vite-env.d.ts
