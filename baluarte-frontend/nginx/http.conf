# HTTP na porta 80 (publicada como 8081): o frontend e o proxy /api, como sempre foi.
# É o que sobe sem certificado e o padrão também com certificado (HTTPS_REDIRECT=0),
# porque as suítes (Playwright em modo real, Newman, README) usam http://localhost:8081.
server {
    listen 80;
    server_name _;
    include /etc/nginx/baluarte/app.conf;
}
