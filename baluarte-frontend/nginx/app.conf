# Conteúdo comum aos servidores HTTP (80) e HTTPS (443) do frontend Baluarte.
# Incluído por http.conf e https.conf; o entrypoint (40-baluarte-tls.sh) monta o
# /etc/nginx/conf.d/default.conf com os blocos que valem para cada subida.
# - Serve o build estático com fallback para index.html (rotas do React Router).
# - Encaminha /api para o backend Express na rede do Compose.
# Os cabeçalhos de segurança se repetem em cada location porque `add_header`
# não é herdado quando o bloco define os seus próprios cabeçalhos.
# $baluarte_hsts (mapas.conf) só tem valor em conexão HTTPS: no HTTP o cabeçalho
# Strict-Transport-Security não é emitido (o Nginx omite add_header com valor vazio).
# A location /api/ não define add_header, então herda os quatro cabeçalhos daqui.

root /usr/share/nginx/html;
index index.html;

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Strict-Transport-Security $baluarte_hsts always;

# Assets com hash no nome podem ser cacheados por muito tempo.
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security $baluarte_hsts always;
    try_files $uri =404;
}

# DNS interno do Docker: resolve `backend` a cada 10 s, então o Nginx sobe mesmo
# sem a API no ar e acompanha a troca de IP do serviço.
resolver 127.0.0.11 valid=10s ipv6=off;

location /api/ {
    set $upstream_api backend;
    proxy_pass http://$upstream_api:8080$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # "https" quando a requisição chegou pela 443: a API sabe que o cliente usou TLS.
    proxy_set_header X-Forwarded-Proto $scheme;
    # A API (helmet) manda o próprio Strict-Transport-Security, com includeSubDomains. Atrás
    # deste proxy quem decide o HSTS é o Nginx: sem isto a resposta sairia com dois cabeçalhos
    # e o da API, aceito pelo navegador em https://localhost:8443, furaria a exceção de
    # localhost de mapas.conf.
    proxy_hide_header Strict-Transport-Security;
}

# index.html (e qualquer rota do SPA) nunca fica em cache: após um deploy o
# navegador precisa buscar o index novo, que aponta para os chunks novos.
location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security $baluarte_hsts always;
    try_files $uri $uri/ /index.html;
}
