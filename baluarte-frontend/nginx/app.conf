# Conteúdo comum aos servidores HTTP (80) e HTTPS (443) do frontend Baluarte.
# Incluído por http.conf e https.conf; o entrypoint (40-baluarte-tls.sh) monta o
# /etc/nginx/conf.d/default.conf com os blocos que valem para cada subida.
# - Serve o build estático com fallback para index.html (rotas do React Router).
# - Encaminha /api para o backend Express na rede do Compose.
# Os cabeçalhos de segurança se repetem em cada location porque `add_header`
# não é herdado quando o bloco define os seus próprios cabeçalhos.
# $baluarte_hsts (mapas.conf) só tem valor em conexão HTTPS: no HTTP o cabeçalho
# Strict-Transport-Security não é emitido (o Nginx omite add_header com valor vazio).
# A location /api/ não define add_header, então herda os quatro cabeçalhos daqui.

root /usr/share/nginx/html;
index index.html;

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Strict-Transport-Security $baluarte_hsts always;

# Assets com hash no nome podem ser cacheados por muito tempo.
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security $baluarte_hsts always;
    try_files $uri =404;
}

# DNS interno do Docker: resolve `backend` a cada 10 s, então o Nginx sobe mesmo
# sem a API no ar e acompanha a troca de IP do serviço.
resolver 127.0.0.11 valid=10s ipv6=off;

# O encaminhamento em si (destino, cabeçalhos) fica em proxy-api.conf, igual nas duas rotas.
# 2 MB = o maior corpo que a API aceita fora da análise de arquivos: as rotas do agente osquery
# (/api/agentes/osquery/*, que chegam por aqui na 8443). Sem a linha valia o padrão do Nginx,
# 1 MB, e um lote de inventário entre 1 e 2 MB levava 413 do Nginx antes de chegar à API. O JSON
# das demais rotas continua limitado a 64 kB pela própria API.
location /api/ {
    client_max_body_size 2m;
    include /etc/nginx/baluarte/proxy-api.conf;
}

# Análise de arquivos (B04): a única rota com corpo grande, até 250 MB por arquivo
# (LIMITE_ARQUIVO_BYTES na API). 251m deixa a folga do envelope multipart, para quem decide o
# limite ser a API (413 ARQUIVO_MUITO_GRANDE em JSON); acima disso o Nginx recusa sozinho.
# Sem buffer: por padrão o Nginx juntaria o corpo inteiro num arquivo temporário (disco) antes
# de repassar; com `proxy_request_buffering off` ele repassa em fluxo e a API decide o 413 no
# caminho. Depois do último byte a API espera o veredito do clamd (com 250 MB, de segundos a
# pouco mais de 1 min medido): o tempo de leitura acompanha o da API (CLAMAV_TIMEOUT_MS, 300 s)
# com folga, para quem responder no limite ser a API (503 em JSON), e não um 504 do Nginx.
location = /api/arquivos/analise {
    client_max_body_size 251m;
    proxy_request_buffering off;
    proxy_read_timeout 330s;
    include /etc/nginx/baluarte/proxy-api.conf;
}

# index.html (e qualquer rota do SPA) nunca fica em cache: após um deploy o
# navegador precisa buscar o index novo, que aponta para os chunks novos.
location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security $baluarte_hsts always;
    try_files $uri $uri/ /index.html;
}
