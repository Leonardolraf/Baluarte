# HTTPS na porta 443 (publicada como 8443). Só entra no default.conf quando
# /etc/nginx/certs/servidor.crt e servidor.key existem (gerados por
# scripts/gerar-certificados.sh e montados por volume a partir de certs/servidor/).
# TLS 1.3 (RNF-001) e 1.2, nada abaixo; cifras do perfil "intermediate" da Mozilla.
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/servidor.crt;
    ssl_certificate_key /etc/nginx/certs/servidor.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:BALUARTE_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/baluarte/app.conf;
}
