# HTTP na porta 80 só redireciona para o HTTPS (HTTPS_REDIRECT=1 e certificado presente).
# __HTTPS_PORT__ é a porta publicada do HTTPS (HTTPS_PORT, padrão 8443): o Nginx escuta na
# 443 dentro do contêiner e não tem como saber a porta do lado de fora.
# 308 (e não 301) mantém o método e o corpo: um POST para /api continua POST.
server {
    listen 80;
    server_name _;
    add_header X-Content-Type-Options nosniff always;
    location / {
        return 308 https://$host:__HTTPS_PORT__$request_uri;
    }
}
