# Encaminhamento de /api para o backend Express na rede do Compose. Incluído pelas duas
# locations de app.conf (/api/ e a análise de arquivos); não é um bloco completo (o Dockerfile
# copia todo nginx/*.conf para /etc/nginx/baluarte/, mas o entrypoint só monta mapas, http e
# https no default.conf).
set $upstream_api backend;
proxy_pass http://$upstream_api:8080$request_uri;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# "https" quando a requisição chegou pela 443: a API sabe que o cliente usou TLS.
proxy_set_header X-Forwarded-Proto $scheme;
# A API (helmet) manda o próprio Strict-Transport-Security, com includeSubDomains. Atrás
# deste proxy quem decide o HSTS é o Nginx: sem isto a resposta sairia com dois cabeçalhos
# e o da API, aceito pelo navegador em https://localhost:8443, furaria a exceção de
# localhost de mapas.conf.
proxy_hide_header Strict-Transport-Security;
