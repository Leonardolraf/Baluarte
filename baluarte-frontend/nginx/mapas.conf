# Contexto http (sempre o início do default.conf montado pelo entrypoint).
#
# Valor do Strict-Transport-Security: só em conexão HTTPS ($https = "on").
# Exceção de propósito: `localhost` (e os loopbacks). HSTS vale para o nome inteiro,
# em qualquer porta; se o navegador o guardasse para `localhost`, passaria a forçar
# https em http://localhost:8081, :3000 (legado), :5173 (Vite) e :8025 (Mailpit), que
# só falam HTTP. Em qualquer outro nome (`app`, o nome da máquina, *.lan) ele é enviado.
# __HSTS_MAX_AGE__ vem de HSTS_MAX_AGE (padrão 31536000 = 1 ano; 0 faz o navegador esquecer).
map "$https:$host" $baluarte_hsts {
    default "";
    "~^on:(localhost|127\.0\.0\.1|\[::1\])$" "";
    "~^on:" "max-age=__HSTS_MAX_AGE__";
}

# Política de segurança de conteúdo (melhoria 14). Entra em modo RELATÓRIO
# (`Content-Security-Policy-Report-Only`): o navegador avisa no console o que violaria a
# política, mas não bloqueia nada. É de propósito — CSP mal ajustada quebra a tela em
# silêncio, sem erro no servidor. Virar `Content-Security-Policy` (bloqueante) é decisão
# separada, depois de conferir o console sem violação.
#
# Por que cada diretiva:
#   script-src 'self'      — o build do Vite não emite script inline (conferido no index.html
#                            publicado); todo JavaScript vem de /assets/.
#   style-src 'unsafe-inline' — o React escreve estilo em atributo (`style={{ width }}` nas
#                            barras e medidores). Sem isso, as barras do dashboard somem.
#   img-src data:          — ícones SVG embutidos e o PDF gerado no mock.
#   connect-src 'self'     — no Docker a API é same-origin (/api pelo proxy do Nginx).
#   frame-ancestors 'none' — mesma intenção do X-Frame-Options, na versão que os navegadores
#                            novos respeitam.
map $host $baluarte_csp {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'";
}
